# Render Blueprint: creates the API and the website from this repo.
# Render dashboard → New → Blueprint → pick this repo. Values marked
# "sync: false" are asked for during setup (they are secrets or URLs).
services:
  - type: web
    name: amora-sales-api
    runtime: node
    rootDir: sales-backend
    buildCommand: npm install
    startCommand: node server.js
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false
      - key: DB_NAME # e.g. amora_demo; leave empty to use the database in MONGO_URI
        sync: false
      - key: CORS_ORIGINS # the website URL, e.g. https://amora-sales.onrender.com
        sync: false
      - key: NODE_ENV
        value: production

  - type: web
    name: amora-sales
    runtime: static
    rootDir: salesapp
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL # the API URL, e.g. https://amora-sales-api.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
